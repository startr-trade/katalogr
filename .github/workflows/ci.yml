name: ci

# One run per change (as kanbanr's CI): a push to main, a pull request, or on demand. Other branch
# pushes do not run CI; local `make ci` covers them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run for the same branch or pull request makes the older one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# As sutra's CI: builds here are one-shot, so incremental artifacts only bloat the cache, and debug
# info is the bulk of a debug build (and of Windows link time) while nothing here needs a debugger.
# Panics still name the failing test. Local builds are unaffected.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # FEAT-114: the version being built has its release notes, so its tag is not refused later.
      - name: The workspace version has release notes
        run: |
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          sh scripts/release-notes-check.sh "v$v"
      # FEAT-112: the workflow files themselves are linted.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: actionlint@1.7.12
      - name: actionlint
        run: actionlint -color

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      # Compiled dependencies are kept between runs, keyed on Cargo.lock and the toolchain.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Saved from main only; pull requests restore main's cache instead of adding their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Test ci::builds_without_mcp_feature (FEAT-067 R-14)
      - name: cargo clippy (no mcp feature)
        run: cargo clippy -p katalogr --no-default-features --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned images (as kanbanr): a runner image update does not change results unannounced.
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # A hung test fails the job in an hour instead of holding a runner for six.
    timeout-minutes: 60
    steps:
      # FEAT-113: build and temp files on a Dev Drive (ReFS, trusted: no Defender filter).
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        if: runner.os == 'Windows'
        with:
          drive-size: 16GB
          drive-format: ReFS
          trusted-dev-drive: true
          env-mapping: |
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
            TMP,{{ DEV_DRIVE }}/tmp
            TEMP,{{ DEV_DRIVE }}/tmp
      - name: temp folder on the Dev Drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:TMP | Out-Null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
      # Compiled dependencies are kept between runs, keyed on Cargo.lock and the toolchain.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # On Windows the target dir is on the Dev Drive; the cache follows it.
          workspaces: ${{ runner.os == 'Windows' && format('. -> {0}', env.CARGO_TARGET_DIR) || '. -> target' }}
          # Saved from main only; pull requests restore main's cache instead of adding their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cargo-nextest runs the test binaries side by side, as `make test` does (same tests).
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      - name: cargo test
        run: cargo nextest run --workspace --locked --no-fail-fast
      # nextest does not run doctests.
      - name: cargo test (doctests)
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc --locked
      - name: cargo test (failpoints, crash suite)
        if: matrix.os == 'ubuntu-24.04'
        run: cargo nextest run -p katalogr-engine --features failpoints --locked --no-fail-fast
      - name: retrieval gate
        if: matrix.os == 'ubuntu-24.04'
        run: cargo run --locked -p katalogr -- eval run --sets fixtures/eval --baseline fixtures/eval/baseline.json --gate
