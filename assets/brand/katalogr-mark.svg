<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="katalogr mark">
  <!-- Two library catalogue cards, the front one with its heading and a line of text, and the
       punched hole every catalogue card has for the drawer rod. The thread comes out of that hole
       and leads to a saffron dot: a reference followed from its entry to what it names. -->
    <rect x="44" y="20" width="92" height="64" rx="8" fill="#FFFFFF" stroke="#26317E" stroke-width="5"/>
    <rect x="24" y="38" width="92" height="64" rx="8" fill="#FFFFFF" stroke="#26317E" stroke-width="5"/>
    <path d="M38 56 H90" fill="none" stroke="#26317E" stroke-width="6" stroke-linecap="round"/>
    <path d="M38 72 H76" fill="none" stroke="#26317E" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 88 V122 C70 132 76 138 86 138 H110" fill="none" stroke="#26317E" stroke-width="7" stroke-linecap="round"/>
    <circle cx="70" cy="88" r="7" fill="#FFFFFF" stroke="#26317E" stroke-width="4"/>
    <circle cx="124" cy="138" r="13" fill="#E8871E"/>
</svg>
