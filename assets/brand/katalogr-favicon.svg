<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="katalogr">
  <!-- Favicon cut of the catalogue-card mark: a solid front card with its punched hole, the back
       card as an outline, a heavier thread and the saffron dot, so each still reads at 16 px.
       Theme-aware via prefers-color-scheme. -->
  <style>
    .ink    { fill: #26317E; }
    .line   { stroke: #26317E; }
    .ground { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .ink    { fill: #AEB6E8; }
      .line   { stroke: #AEB6E8; }
      .ground { fill: #0F1117; }
    }
  </style>
  <rect class="ground line" x="38" y="8" width="80" height="58" rx="9" stroke-width="8"/>
  <rect class="ink" x="10" y="26" width="86" height="62" rx="9"/>
  <path class="line" d="M53 70 V100 C53 110 60 116 70 116 H86" fill="none" stroke-width="13" stroke-linecap="round"/>
  <circle class="ground" cx="53" cy="68" r="9"/>
  <circle cx="104" cy="114" r="15" fill="#E8871E"/>
</svg>
