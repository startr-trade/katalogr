openapi: 3.0.3
info:
  title: Example API
  version: "1.0"
paths: {}
components:
  schemas:
    Pet:
      type: object
      required: [name]
      description: A pet in the example store.
      properties:
        name: {type: string}
        tag: {type: string}
        owner:
          $ref: '#/components/schemas/Owner'
        photos:
          type: array
          items: {type: string, format: binary}
    Owner:
      type: object
      properties:
        id: {type: integer}
