[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/startr-trade/katalogr"
homepage = "https://github.com/startr-trade/katalogr"
# rmcp 3.5.0 (FEAT-067) declares rust-version 1.88; the highest of any package built for a
# release target is ra_ap_syntax 0.0.358 at 1.98 (archtest::rust_version_covers_dependencies)
rust-version = "1.98"

[workspace.dependencies]
katalogr-model = { path = "crates/katalogr-model", version = "0.1.0" }
katalogr-store = { path = "crates/katalogr-store", version = "0.1.0" }
katalogr-engine = { path = "crates/katalogr-engine", version = "0.1.0" }
katalogr-ext-rust = { path = "crates/katalogr-ext-rust", version = "0.1.0" }
katalogr-ext-wasm = { path = "crates/katalogr-ext-wasm", version = "0.1.0" }
katalogr-query = { path = "crates/katalogr-query", version = "0.1.0" }
katalogr-analytics = { path = "crates/katalogr-analytics", version = "0.1.0" }
katalogr-dist = { path = "crates/katalogr-dist", version = "0.1.0" }
katalogr-ext-ts = { path = "crates/katalogr-ext-ts", version = "0.1.0" }
katalogr-ext-sql = { path = "crates/katalogr-ext-sql", version = "0.1.0" }
katalogr-ext-md = { path = "crates/katalogr-ext-md", version = "0.1.0" }
katalogr-ext-kanbanr = { path = "crates/katalogr-ext-kanbanr", version = "0.1.0" }
katalogr-ext-data = { path = "crates/katalogr-ext-data", version = "0.1.0" }
katalogr-ext-text = { path = "crates/katalogr-ext-text", version = "0.1.0" }
katalogr-ext-schema = { path = "crates/katalogr-ext-schema", version = "0.1.0" }
katalogr-ext-openapi = { path = "crates/katalogr-ext-openapi", version = "0.1.0" }
katalogr-bench = { path = "crates/katalogr-bench", version = "0.1.0" }
quick-xml = "=0.41.0"
saphyr-parser = "=0.1.0"
oxc_parser = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_span = "=0.154.0"
oxc_allocator = "=0.154.0"
oxc_ast_visit = "=0.154.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha1 = "0.10"
sha2 = "0.11"
thiserror = "2.0"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
redb = { version = "=4.4.0", features = ["experimental-multiprocess"] }
fs4 = "1.1"
tempfile = "3.27"
camino = { version = "1.2", features = ["serde1"] }
gix = { version = "0.90", default-features = false }
proptest = "1.12"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
globset = "0.4"
toml = "1.1"
ra_ap_syntax = "=0.0.358"
schemars = "1.2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
rayon = "=1.12.0"
sqlparser = { version = "=0.63.0", default-features = false, features = ["std", "visitor"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "time", "sync", "io-std", "io-util", "macros"] }
