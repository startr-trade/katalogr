[package]
name = "katalogr"
description = "The katalogr CLI: a thin wrapper over katalogr-dist."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "katalogr"
path = "src/main.rs"

[dependencies]
katalogr-dist.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The `.tx` test extractor gives integration tests symbols to query.
katalogr-dist = { workspace = true, features = ["test-extractor"] }
tempfile.workspace = true
fs4.workspace = true
