[book]
title = "katalogr"
description = "A deterministic, technology- and protocol-neutral traceability graph for polyglot systems"
authors = ["The katalogr Authors"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
additional-css = ["brand.css"]
git-repository-url = "https://github.com/startr-trade/katalogr"
edit-url-template = "https://github.com/startr-trade/katalogr/edit/main/docs/{path}"

[output.html.search]
enable = true
