      operationId: placeOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Receipt'
      responses:
        "201":
          description: created
components:
  schemas:
    Receipt:
      type: object
      properties:
        id: {type: string}
