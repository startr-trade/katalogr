name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Test ci::builds_without_mcp_feature (FEAT-067 R-14)
      - name: cargo clippy (no mcp feature)
        run: cargo clippy -p katalogr --no-default-features --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test fails the job in an hour instead of holding a runner for six.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast
      - name: cargo test (failpoints, crash suite)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p katalogr-engine --features failpoints --locked
      - name: retrieval gate
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --locked -p katalogr -- eval run --sets fixtures/eval --baseline fixtures/eval/baseline.json --gate

  no-c:
    # Requirement R-6. Test: ci::builds_without_c_compiler
    runs-on: ubuntu-latest
    env:
      CC: "false"
      CXX: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
      # Test ci::builds_without_c_compiler: build and test with no C compiler available.
      - name: cargo build (no C compiler)
        run: cargo build --workspace --locked
      - name: cargo test (no C compiler)
        run: cargo test --workspace --locked --no-fail-fast
