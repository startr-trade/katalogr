name: ci

# One run per change (as kanbanr's CI): a push to main, a pull request, or on demand. Other branch
# pushes do not run CI; local `make ci` covers them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run for the same branch or pull request makes the older one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      # Compiled dependencies are kept between runs, keyed on Cargo.lock and the toolchain.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Test ci::builds_without_mcp_feature (FEAT-067 R-14)
      - name: cargo clippy (no mcp feature)
        run: cargo clippy -p katalogr --no-default-features --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned images (as kanbanr): a runner image update does not change results unannounced.
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # A hung test fails the job in an hour instead of holding a runner for six.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
      # Compiled dependencies are kept between runs, keyed on Cargo.lock and the toolchain.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # cargo-nextest runs the test binaries side by side, as `make test` does (same tests).
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      - name: cargo test
        run: cargo nextest run --workspace --locked --no-fail-fast
      # nextest does not run doctests.
      - name: cargo test (doctests)
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc --locked
      - name: cargo test (failpoints, crash suite)
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test -p katalogr-engine --features failpoints --locked
      - name: retrieval gate
        if: matrix.os == 'ubuntu-24.04'
        run: cargo run --locked -p katalogr -- eval run --sets fixtures/eval --baseline fixtures/eval/baseline.json --gate
