<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="katalogr logo">
  <!-- The catalogue-card mark, then the thread out of the card's punched hole runs down, along and
       up to become the headline bar the wordmark hangs from — the same thread that carries every
       startr.trade lockup — ending in a saffron arrow. -->
  <g transform="translate(14,20)">
    <rect x="44" y="20" width="92" height="64" rx="8" fill="#FFFFFF" stroke="#26317E" stroke-width="5"/>
    <rect x="24" y="38" width="92" height="64" rx="8" fill="#FFFFFF" stroke="#26317E" stroke-width="5"/>
    <path d="M38 56 H90" fill="none" stroke="#26317E" stroke-width="6" stroke-linecap="round"/>
    <path d="M38 72 H76" fill="none" stroke="#26317E" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="M84 108 V142 C84 152 90 158 100 158 H140 C170 158 164 52 196 52 H686" fill="none" stroke="#26317E" stroke-width="5" stroke-linecap="round"/>
  <circle cx="84" cy="108" r="7" fill="#FFFFFF" stroke="#26317E" stroke-width="4"/>
  <path d="M686 44 L704 52 L686 60 Z" fill="#E8871E"/>
  <text x="212" y="124" font-family="'Noto Sans','Segoe UI',ui-sans-serif,sans-serif"
        font-size="74" font-weight="700" letter-spacing="1" fill="#26317E">katalogr</text>
  <text x="216" y="166" font-family="'Noto Sans','Segoe UI',ui-sans-serif,sans-serif"
        font-size="26" fill="#8A8FA8">κατάλογος · a register of links</text>
</svg>
