swagger: "2.0"
info:
  title: Example API
  version: "1.0"
host: api.example.test
basePath: /v1
paths:
  /users:
    get:
      operationId: listUsers
      summary: List users
      responses:
        "200": {description: ok}
  /users/{id}:
    get:
      operationId: getUser
      responses:
        "200": {description: ok}
definitions:
  User:
    type: object
    properties:
      id: {type: integer}
      name: {type: string}
