[package]
name = "katalogr-dist"
description = "Composition root: the Katalogr facade with extensions registered."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Registers the `.tx` test extractor; for integration tests only.
test-extractor = []
# The embedded web view assets (FEAT-033).
web = ["dep:katalogr-web"]

[dependencies]
katalogr-query.workspace = true
katalogr-analytics.workspace = true
katalogr-engine.workspace = true
katalogr-ext-rust.workspace = true
katalogr-ext-ts.workspace = true
katalogr-ext-sql.workspace = true
katalogr-ext-md.workspace = true
katalogr-ext-kanbanr.workspace = true
katalogr-ext-data.workspace = true
katalogr-ext-text.workspace = true
katalogr-ext-schema.workspace = true
katalogr-ext-openapi.workspace = true
katalogr-model.workspace = true
katalogr-store.workspace = true
katalogr-render.workspace = true
katalogr-web = { workspace = true, optional = true }
camino.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
