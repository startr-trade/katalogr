[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/startr-trade/katalogr"
homepage = "https://github.com/startr-trade/katalogr"
rust-version = "1.85"

[workspace.dependencies]
katalogr-model = { path = "crates/katalogr-model", version = "0.1.0" }
katalogr-store = { path = "crates/katalogr-store", version = "0.1.0" }
katalogr-engine = { path = "crates/katalogr-engine", version = "0.1.0" }
katalogr-ext-rust = { path = "crates/katalogr-ext-rust", version = "0.1.0" }
katalogr-query = { path = "crates/katalogr-query", version = "0.1.0" }
katalogr-dist = { path = "crates/katalogr-dist", version = "0.1.0" }
katalogr-ext-ts = { path = "crates/katalogr-ext-ts", version = "0.1.0" }
oxc_parser = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_span = "=0.154.0"
oxc_allocator = "=0.154.0"
oxc_ast_visit = "=0.154.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha1 = "0.10"
sha2 = "0.11"
thiserror = "2.0"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
redb = "4.4"
fs4 = "1.1"
tempfile = "3.27"
camino = { version = "1.2", features = ["serde1"] }
gix = { version = "0.89", default-features = false }
proptest = "1.12"
globset = "0.4"
toml = "1.1"
ra_ap_syntax = "=0.0.358"
schemars = "1.2"
